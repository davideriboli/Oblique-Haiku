<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oblique Strategies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff00;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.05em;
            line-height: 1.5;
        }

        /* Effetto scanline */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: left;
            max-width: 800px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.2s both;
            font-size: 14px;
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
        }

        .header::before {
            content: '> ';
            color: #00ff00;
        }

        .header::after {
            content: ' _';
            animation: blink 1s infinite;
        }

        .haiku-container {
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        .haiku {
            font-size: 18px;
            line-height: 2.2;
            margin: 20px 0;
            color: #00ff00;
        }

        .verso {
            margin-bottom: 24px;
            padding-left: 20px;
            position: relative;
        }

        .verso::before {
            content: '> ';
            position: absolute;
            left: 0;
            color: #00aa00;
        }

        .verso:last-child {
            margin-bottom: 0;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 30px;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }

        button {
            padding: 10px 24px;
            font-size: 14px;
            font-family: 'Courier New', 'Monaco', 'Consolas', monospace;
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        button::before {
            content: '[';
            margin-right: 8px;
        }

        button::after {
            content: ']';
            margin-left: 8px;
        }

        button:hover {
            background: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        .stats {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #00aa00;
            animation: fadeIn 1.3s ease-out 0.8s both;
            border-top: 1px solid #00aa00;
            padding-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }

            .haiku {
                font-size: 16px;
            }

            button {
                padding: 8px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>

            </div>
        </div>

        <div class="button-container">
            <button onclick="mostraUnaFrase()">1 strategia</button>
            <button onclick="cambiaHaiku()">3 strategie</button>
        </div>

        <div class="stats">
            <span id="counter">Database: 0 strategie</span>

    </div>

        function generaHaikuUnique() {
            // Seleziona tre indici diversi a caso
            let indici = [];
            while (indici.length < 3) {
                let idx = Math.floor(Math.random() * fraseOblique.length);
                if (!indici.includes(idx)) {
                    indici.push(idx);
                }
            }

            return {
                verso1: fraseOblique[indici[0]],
                verso2: fraseOblique[indici[1]],
                verso3: fraseOblique[indici[2]]
            };
        }

        function mostraHaiku(haiku) {
            document.getElementById('verso1').textContent = haiku.verso1;
            document.getElementById('verso2').textContent = haiku.verso2;
            document.getElementById('verso3').textContent = haiku.verso3;
        }

        function generaUnaFrase() {
            let idx = Math.floor(Math.random() * fraseOblique.length);
            return fraseOblique[idx];
        }

        function mostraUnaFrase() {
            document.getElementById('verso1').textContent = generaUnaFrase();
            document.getElementById('verso2').style.display = 'none';
            document.getElementById('verso3').style.display = 'none';
        }

        function cambiaHaiku() {
            document.getElementById('verso2').style.display = '';
            document.getElementById('verso3').style.display = '';
            mostraHaiku(generaHaikuUnique());
        }

        function mostraStats() {
            document.getElementById('counter').textContent = `Database: ${fraseOblique.length} strategie`;
        }
